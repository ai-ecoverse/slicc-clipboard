name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
  statuses: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/pipeline.yml@v2.13.0
    secrets: inherit
    with:
      test-glob: test/integration/*.test.mjs
      shards: 2
      windows-test: npm run test:windows
      review-prompt: |
        SLICC-CLIPBOARD

        This repository is slicc-clipboard (`@ai-ecoverse/slicc-clipboard`): `pbcopy`, `pbpaste`, `xclip`, `xsel`, `wl-copy`, `wl-paste`, `sccopy` and `scpaste` as POSIX `sh` scripts in `bin/` over the slicc-kernel's `/dev/clipboard`, and `sccopy` and `scpaste` for ordinary hosts as Node in `host/` (pbcopy/pbpaste on macOS, wl-clipboard, xclip or xsel on Linux, PowerShell on Windows). The README is the contract: read the sections the change touches first. `git diff origin/main...HEAD`, or `$RUNNER_TEMP/review/context/pr.diff`, is the change.

        Look for real defects, in this order:
        1. Correctness: the scripts are POSIX `sh` (dash), use only `/dev/clipboard`, write to it through coreutils `cat`, keep bytes unchanged, and accept the options the README lists; `host/` picks the tool and argv the README names for each platform.
        2. Security: no clipboard content reaches an error, a log or another process than the one tool.
        3. Tests: every behaviour change has an integration test in `test/integration/`, and a fix's test fails without the fix.
        4. Repo rules: no comments anywhere (YAML too), no unit tests in git, and a conventional-commit title (`fix`, `feat` and `perf` release, the rest don't).
